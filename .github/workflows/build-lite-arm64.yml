name: Build Lite ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-lite-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  WMKB_SPLIT_APKS: "true"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  build:
    name: Build arm64 v8 lite fast APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Assemble lite fast APK (arm64 split ~12MB)
        run: ./gradlew :app:assembleLiteEnFast --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wmkb-lite-arm64-v8-fast
          path: app/build/outputs/apk/liteEn/fast/*arm64*.apk
          retention-days: 7
